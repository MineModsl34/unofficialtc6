plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

// Stage 11 keeps these reviewed runtime snapshots in main and reproduces them during datagen.
// Exclude ONLY byte-identical generated clones; a divergent clone is a real conflict, not an
// order-dependent override. Other duplicates retain Gradle's default failure behavior.
def stageElevenSnapshotPaths = [
        'assets/thaumcraft/shader/ender.vert',
        'assets/thaumcraft/shader/ender.frag',
        'assets/thaumcraft/shader/sketch.vert',
        'assets/thaumcraft/shader/sketch.frag',
        'assets/thaumcraft/shader/test.frag',
        'assets/thaumcraft/shaders/core/boss_ender.json',
        'assets/thaumcraft/shaders/core/boss_ender.vsh',
        'assets/thaumcraft/shaders/core/boss_ender.fsh',
        'assets/thaumcraft/shaders/core/source_mirror.json',
        'assets/thaumcraft/shaders/core/source_mirror.vsh',
        'assets/thaumcraft/shaders/core/source_mirror.fsh',
        'assets/thaumcraft/shaders/core/source_sketch.json',
        'assets/thaumcraft/shaders/core/source_sketch.vsh',
        'assets/thaumcraft/shaders/core/source_sketch.fsh',
        'assets/thaumcraft/shaders/core/source_test_unused.fsh',
        'assets/minecraft/atlases/blocks.json',
        'assets/thaumcraft/shaders/core/fx_gui.json',
        'assets/thaumcraft/shaders/core/fx_gui.vsh',
        'assets/thaumcraft/shaders/core/fx_gui.fsh'
] as Set
tasks.named('processResources', ProcessResources).configure {
    eachFile { details ->
        def relative = details.relativePath.pathString
        if (!stageElevenSnapshotPaths.contains(relative)) return
        def generated = project.file("src/generated/resources/${relative}").toPath().toAbsolutePath().normalize()
        // Compare lexical source paths first so a main source is never excluded as an alias.
        if (details.file.toPath().toAbsolutePath().normalize() != generated) return
        def main = project.file("src/main/resources/${relative}").canonicalFile.toPath()
        if (!java.nio.file.Files.isRegularFile(main)
                || java.nio.file.Files.mismatch(generated, main) != -1L) {
            throw new GradleException("Stage 11 generated resource conflicts with its main snapshot: ${relative}")
        }
        details.exclude()
    }
}

repositories {
    // Curios API, replacing Baubles (rings, amulets, belts)
    maven {
        name = 'Curios'
        url = 'https://maven.theillusivec4.top/'
        content { includeGroup 'top.theillusivec4.curios' }
    }
    // TerraBlender: inserts TC biomes into the normal world
    maven {
        name = 'Forge'
        url = 'https://maven.minecraftforge.net/'
        content { includeGroup 'com.github.glitchfiend' }
    }
    // JEI: recipe viewer (optional)
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com/'
        content {
            includeGroup 'mezz.jei'
            includeGroupByRegex 'net\\.mezzdev.*'
        }
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// A new opt-in TCP cohort must stay in a freshly prepared private root before any engine
// process is launched. Existing ordinary client/server/test configurations are unaffected.
def stageFourNetworkRootProperty = providers.gradleProperty('tcResearchStageFourNetworkRoot')
def isStageFourNetwork = stageFourNetworkRootProperty.isPresent()
if (isStageFourNetwork && providers.gradleProperty('tcResearchProgressNetworkRoot').isPresent()) {
    throw new GradleException('Choose exactly one fresh TCP audit purpose')
}
def progressNetworkRootProperty = stageFourNetworkRootProperty.orElse(providers.gradleProperty('tcResearchProgressNetworkRoot'))
def progressNetworkRoot = project.file(progressNetworkRootProperty.getOrElse('build/research-catalog-network/unprepared'))
def progressNetworkIdentity = null
if (progressNetworkRootProperty.isPresent()) {
    def privateBase = project.file('build/research-catalog-network').toPath().toAbsolutePath().normalize()
    def requested = progressNetworkRoot.toPath().toAbsolutePath().normalize()
    if (requested.parent != privateBase || !(requested.fileName.toString() ==~ /[A-Za-z0-9_-]{1,80}/)) {
        throw new GradleException('Research-progress TCP runs require one prepared private run under port/build/research-catalog-network')
    }
    for (def cursor = requested; cursor != null; cursor = cursor.parent) {
        if (!java.nio.file.Files.exists(cursor, java.nio.file.LinkOption.NOFOLLOW_LINKS)) continue
        def attributes = java.nio.file.Files.readAttributes(cursor, java.nio.file.attribute.BasicFileAttributes, java.nio.file.LinkOption.NOFOLLOW_LINKS)
        def reparse = cursor.fileSystem.separator == '\\' && ((java.nio.file.Files.getAttribute(cursor, 'dos:attributes', java.nio.file.LinkOption.NOFOLLOW_LINKS) as int) & 0x400) != 0
        if (attributes.symbolicLink || attributes.other || reparse || cursor.toRealPath() != cursor) {
            throw new GradleException('Linked/reparse TCP audit paths are forbidden before launch')
        }
    }
    ['server', 'client-a', 'client-b'].each { role ->
        def rolePath = requested.resolve(role)
        if (!java.nio.file.Files.isDirectory(rolePath, java.nio.file.LinkOption.NOFOLLOW_LINKS) || rolePath.toRealPath() != rolePath) {
            throw new GradleException('All three real private role directories must be prepared before launch')
        }
        def markers = ['.research-catalog-network-audit.json', isStageFourNetwork ? '.research-stage-four-network-audit.json' : '.research-progress-network-audit.json'].collect { name ->
            def path = rolePath.resolve(name)
            if (!java.nio.file.Files.isRegularFile(path, java.nio.file.LinkOption.NOFOLLOW_LINKS)
                || java.nio.file.Files.size(path) > 4096 || path.toRealPath() != path) {
                throw new GradleException('Missing/unsafe private TCP audit marker')
            }
            new groovy.json.JsonSlurper().parse(path.toFile(), 'UTF-8')
        }
        def baseMarker = markers[0], purposeMarker = markers[1]
        if (baseMarker.marker != 'TC_PORT_RESEARCH_CATALOG_NETWORK_AUDIT_V1' || baseMarker.schemaVersion != 1
            || baseMarker.role != role || baseMarker.runId != requested.fileName.toString()
            || baseMarker.phase != 'generate' || purposeMarker.purpose != (isStageFourNetwork ? 'stage4-read-theory' : 'browser-c2s')
            || !(purposeMarker.networkProtocolVersion instanceof String) || purposeMarker.networkProtocolVersion != '6'
            || ['marker', 'schemaVersion', 'runId', 'token', 'role', 'port', 'phase'].any { baseMarker[it] != purposeMarker[it] }) {
            throw new GradleException('Research-progress companion marker does not match the fresh base cohort')
        }
        java.util.UUID.fromString(baseMarker.token.toString())
        if ((baseMarker.port as int) < 1024 || (baseMarker.port as int) > 65535) {
            throw new GradleException('Invalid private TCP port in audit marker')
        }
        if (progressNetworkIdentity == null) progressNetworkIdentity = baseMarker
        else if (['marker', 'schemaVersion', 'runId', 'token', 'port', 'phase'].any { progressNetworkIdentity[it] != baseMarker[it] }) {
            throw new GradleException('All three audit roles must belong to exactly the same private cohort')
        }
    }
    def propertiesPath = requested.resolve('server').resolve('server.properties')
    if (!java.nio.file.Files.isRegularFile(propertiesPath, java.nio.file.LinkOption.NOFOLLOW_LINKS)
        || java.nio.file.Files.size(propertiesPath) > 8192 || propertiesPath.toRealPath() != propertiesPath) {
        throw new GradleException('Missing/unsafe private TCP server properties')
    }
    def serverProperties = new java.util.Properties()
    propertiesPath.toFile().withInputStream { serverProperties.load(it) }
    if (serverProperties.getProperty('server-ip') != '127.0.0.1'
        || serverProperties.getProperty('server-port') != progressNetworkIdentity.port.toString()
        || serverProperties.getProperty('online-mode') != 'false'
        || serverProperties.getProperty('level-name') != 'research-catalog-network-audit') {
        throw new GradleException('Private progression server must use its exact offline loopback port/world before launch')
    }
}

// Fresh one-owner dedicated TCP bootstrap cohort. The game controllers validate the same
// marker again at runtime before performing any controlled-world/material preparation.
def bootstrapRootProperty = providers.gradleProperty('tcTcpBootstrapRoot')
def bootstrapRoot = project.file(bootstrapRootProperty.getOrElse('build/tcp-bootstrap/unprepared'))
def bootstrapIdentity = null
def bootstrapReload = false
if (bootstrapRootProperty.isPresent()) {
    if (progressNetworkRootProperty.isPresent()) throw new GradleException('TCP audit purposes are exclusive')
    def requested = bootstrapRoot.toPath().toAbsolutePath().normalize()
    def privateBase = project.file('build/tcp-bootstrap').toPath().toAbsolutePath().normalize()
    if (requested.parent != privateBase || !(requested.fileName.toString() ==~ /[A-Za-z0-9_-]{1,80}/)) {
        throw new GradleException('Bootstrap audit requires a prepared private root under port/build/tcp-bootstrap')
    }
    def requirePrivatePath = { path ->
        for (def cursor = path; cursor != null; cursor = cursor.parent) {
            if (!java.nio.file.Files.exists(cursor, java.nio.file.LinkOption.NOFOLLOW_LINKS)) continue
            def attributes = java.nio.file.Files.readAttributes(cursor, java.nio.file.attribute.BasicFileAttributes, java.nio.file.LinkOption.NOFOLLOW_LINKS)
            def reparse = cursor.fileSystem.separator == '\\' && ((java.nio.file.Files.getAttribute(cursor, 'dos:attributes', java.nio.file.LinkOption.NOFOLLOW_LINKS) as int) & 0x400) != 0
            if (attributes.symbolicLink || attributes.other || reparse || cursor.toRealPath() != cursor) {
                throw new GradleException('Linked/reparse bootstrap audit paths are forbidden')
            }
        }
    }
    ['server', 'client'].each { role ->
        def rolePath = requested.resolve(role)
        def markerPath = rolePath.resolve('.tcp-bootstrap-audit.json')
        requirePrivatePath(markerPath)
        if (!java.nio.file.Files.isDirectory(rolePath, java.nio.file.LinkOption.NOFOLLOW_LINKS)
            || !java.nio.file.Files.isRegularFile(markerPath, java.nio.file.LinkOption.NOFOLLOW_LINKS)
            || java.nio.file.Files.size(markerPath) > 4096) throw new GradleException('Prepare both fresh bootstrap roles before launch')
        def marker = new groovy.json.JsonSlurper().parse(markerPath.toFile(), 'UTF-8')
        if (marker.marker != 'TC_PORT_TCP_BOOTSTRAP_AUDIT_V1' || marker.schemaVersion != 1
            || marker.purpose != 'native-bootstrap' || marker.networkProtocolVersion != '6'
            || marker.role != role || marker.runId != requested.fileName.toString()
            || (marker.port as int) < 1024 || (marker.port as int) > 65535) {
            throw new GradleException('Invalid bootstrap role marker')
        }
        java.util.UUID.fromString(marker.token.toString())
        def auditPhase = marker.auditPhase ?: 'generate'
        if (!(auditPhase in ['generate', 'reload']) || (marker.goal != null && marker.goal != 'firststeps')) {
            throw new GradleException('Unknown TCP gameplay phase/goal')
        }
        if (auditPhase == 'reload' && (!(marker.sourceRunId ==~ /[A-Za-z0-9_-]{1,80}/)
            || marker.sourceToken == null || !(marker.worldManifestSha256 ==~ /[a-f0-9]{64}/))) {
            throw new GradleException('Reload requires the stopped generation source and copied-world manifest')
        }
        if (auditPhase == 'reload') java.util.UUID.fromString(marker.sourceToken.toString())
        if (bootstrapIdentity == null) bootstrapIdentity = marker
        else if (['marker', 'schemaVersion', 'runId', 'token', 'purpose', 'networkProtocolVersion', 'port',
            'auditPhase', 'goal', 'sourceRunId', 'sourceToken', 'sourcePort', 'sourceServerReportSha256',
            'sourceRuntimeSha256', 'worldManifestSha256'].any { bootstrapIdentity[it] != marker[it] }) {
            throw new GradleException('Bootstrap role identities disagree')
        }
    }
    bootstrapReload = bootstrapIdentity.auditPhase == 'reload'
    def propertiesPath = requested.resolve('server/server.properties')
    requirePrivatePath(propertiesPath)
    if (!java.nio.file.Files.isRegularFile(propertiesPath) || java.nio.file.Files.size(propertiesPath) > 8192) {
        throw new GradleException('Missing private bootstrap server properties')
    }
    def properties = new java.util.Properties()
    propertiesPath.toFile().withInputStream { properties.load(it) }
    if (properties.getProperty('server-ip') != '127.0.0.1' || properties.getProperty('server-port') != bootstrapIdentity.port.toString()
        || properties.getProperty('online-mode') != 'false' || properties.getProperty('level-name') != 'tcp-bootstrap-audit') {
        throw new GradleException('Bootstrap server must use its exact offline loopback port/world')
    }
}

// Material-controlled native alchemy progression; every phase copies a stopped,
// independently verified private world and uses a distinct pair of engine JVMs.
def alchemyRootProperty = providers.gradleProperty('tcTcpAlchemyRoot')
def alchemyRoot = project.file(alchemyRootProperty.getOrElse('build/tcp-alchemy/unprepared'))
def alchemyIdentity = null
if (alchemyRootProperty.isPresent()) {
    if (bootstrapRootProperty.isPresent() || progressNetworkRootProperty.isPresent()) {
        throw new GradleException('TCP audit purposes are exclusive')
    }
    def requested = alchemyRoot.toPath().toAbsolutePath().normalize()
    if (requested.parent != project.file('build/tcp-alchemy').toPath().toAbsolutePath().normalize()
        || !(requested.fileName.toString() ==~ /[A-Za-z0-9_-]{1,80}/)) {
        throw new GradleException('Alchemy audit requires its prepared immediate private root')
    }
    def requireAlchemyPath = { path ->
        for (def cursor = path; cursor != null; cursor = cursor.parent) {
            if (!java.nio.file.Files.exists(cursor, java.nio.file.LinkOption.NOFOLLOW_LINKS)) continue
            def attributes = java.nio.file.Files.readAttributes(cursor, java.nio.file.attribute.BasicFileAttributes,
                java.nio.file.LinkOption.NOFOLLOW_LINKS)
            def reparse = cursor.fileSystem.separator == '\\' &&
                ((java.nio.file.Files.getAttribute(cursor, 'dos:attributes', java.nio.file.LinkOption.NOFOLLOW_LINKS) as int) & 0x400) != 0
            if (attributes.symbolicLink || attributes.other || reparse || cursor.toRealPath() != cursor) {
                throw new GradleException('Linked/reparse alchemy paths are forbidden')
            }
        }
    }
    ['server', 'client'].each { role ->
        def markerPath = requested.resolve(role).resolve('.tcp-alchemy-audit.json')
        requireAlchemyPath(markerPath)
        if (!java.nio.file.Files.isRegularFile(markerPath) || java.nio.file.Files.size(markerPath) > 8192) {
            throw new GradleException('Prepare both private alchemy roles before launch')
        }
        def marker = new groovy.json.JsonSlurper().parse(markerPath.toFile(), 'UTF-8')
        if (marker.marker != 'TC_PORT_TCP_ALCHEMY_AUDIT_V1' || marker.schemaVersion != 1
            || marker.purpose != 'native-alchemy' || marker.goal != 'alchemy' || marker.networkProtocolVersion != '6'
            || marker.runId != requested.fileName.toString() || marker.role != role
            || !(marker.auditPhase in ['generate', 'resume', 'reload'])
            || (marker.port as int) < 1024 || (marker.port as int) > 65535
            || !(marker.sourceRunId ==~ /[A-Za-z0-9_-]{1,80}/)
            || !(marker.worldManifestSha256 ==~ /[a-f0-9]{64}/)) {
            throw new GradleException('Invalid alchemy identity/phase/source')
        }
        java.util.UUID.fromString(marker.token.toString())
        java.util.UUID.fromString(marker.sourceToken.toString())
        if (alchemyIdentity == null) alchemyIdentity = marker
        else if (alchemyIdentity.findAll { key, value -> key != 'role' }
            != marker.findAll { key, value -> key != 'role' }) {
            throw new GradleException('Alchemy role identities disagree')
        }
    }
    def propertiesPath = requested.resolve('server/server.properties')
    requireAlchemyPath(propertiesPath)
    if (!java.nio.file.Files.isRegularFile(propertiesPath) || java.nio.file.Files.size(propertiesPath) > 8192) {
        throw new GradleException('Missing private alchemy server properties')
    }
    def properties = new java.util.Properties()
    propertiesPath.toFile().withInputStream { properties.load(it) }
    if (properties.getProperty('server-ip') != '127.0.0.1'
        || properties.getProperty('server-port') != alchemyIdentity.port.toString()
        || properties.getProperty('online-mode') != 'false'
        || properties.getProperty('level-name') != 'tcp-alchemy-audit'
        || properties.getProperty('gamemode') != 'survival') {
        throw new GradleException('Alchemy requires its exact private survival TCP server')
    }
}

// Native caster progression continues a byte-exact stopped private world copy.
def casterRootProperty = providers.gradleProperty('tcTcpCasterRoot')
def casterRoot = project.file(casterRootProperty.getOrElse('build/tcp-casters/unprepared'))
def casterIdentity = null
if (casterRootProperty.isPresent()) {
    if (bootstrapRootProperty.isPresent() || alchemyRootProperty.isPresent() || progressNetworkRootProperty.isPresent()) {
        throw new GradleException('TCP audit purposes are exclusive')
    }
    def requested = casterRoot.toPath().toAbsolutePath().normalize()
    if (requested.parent != project.file('build/tcp-casters').toPath().toAbsolutePath().normalize()
        || !(requested.fileName.toString() ==~ /[A-Za-z0-9_-]{1,80}/)) {
        throw new GradleException('Caster audit requires its prepared immediate private root')
    }
    def requireCasterPath = { path ->
        for (def cursor = path; cursor != null; cursor = cursor.parent) {
            if (!java.nio.file.Files.exists(cursor, java.nio.file.LinkOption.NOFOLLOW_LINKS)) continue
            def attributes = java.nio.file.Files.readAttributes(cursor, java.nio.file.attribute.BasicFileAttributes, java.nio.file.LinkOption.NOFOLLOW_LINKS)
            def reparse = cursor.fileSystem.separator == '\\' && ((java.nio.file.Files.getAttribute(cursor, 'dos:attributes', java.nio.file.LinkOption.NOFOLLOW_LINKS) as int) & 0x400) != 0
            if (attributes.symbolicLink || attributes.other || reparse || cursor.toRealPath() != cursor) throw new GradleException('Linked/reparse caster paths are forbidden')
        }
    }
    ['server', 'client'].each { role ->
        def rolePath = requested.resolve(role)
        def markerPath = rolePath.resolve('.tcp-casters-audit.json')
        requireCasterPath(markerPath)
        if (!java.nio.file.Files.isDirectory(rolePath, java.nio.file.LinkOption.NOFOLLOW_LINKS)
            || !java.nio.file.Files.isRegularFile(markerPath) || java.nio.file.Files.size(markerPath) > 16384) throw new GradleException('Prepare both fresh caster roles before launch')
        def marker = new groovy.json.JsonSlurper().parse(markerPath.toFile(), 'UTF-8')
        if (marker.marker != 'TC_PORT_TCP_CASTERS_AUDIT_V1' || marker.schemaVersion != 1
            || marker.purpose != 'native-casters' || marker.goal != 'casters' || marker.networkProtocolVersion != '6'
            || marker.runId != requested.fileName.toString() || marker.role != role
            || !(marker.auditPhase in ['generate', 'reload']) || (marker.port as int) < 1024 || (marker.port as int) > 65535
            || !(marker.sourceRunId ==~ /[A-Za-z0-9_-]{1,80}/) || !(marker.worldManifestSha256 ==~ /[a-f0-9]{64}/)) throw new GradleException('Invalid caster identity/phase/source')
        java.util.UUID.fromString(marker.token.toString())
        java.util.UUID.fromString(marker.sourceToken.toString())
        if (casterIdentity == null) casterIdentity = marker
        else if (casterIdentity.findAll { key, value -> key != 'role' } != marker.findAll { key, value -> key != 'role' }) throw new GradleException('Caster role identities disagree')
    }
    def propertiesPath = requested.resolve('server/server.properties')
    requireCasterPath(propertiesPath)
    if (!java.nio.file.Files.isRegularFile(propertiesPath) || java.nio.file.Files.size(propertiesPath) > 8192) throw new GradleException('Missing private caster server properties')
    def properties = new java.util.Properties()
    propertiesPath.toFile().withInputStream { properties.load(it) }
    if (properties.getProperty('server-ip') != '127.0.0.1' || properties.getProperty('server-port') != casterIdentity.port.toString()
        || properties.getProperty('online-mode') != 'false' || properties.getProperty('level-name') != 'tcp-caster-audit'
        || properties.getProperty('gamemode') != 'survival') throw new GradleException('Caster server must use its exact private survival loopback world')
}

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // Minecraft/NeoForge on the unit test classpath
    addModdingDependenciesTo(sourceSets.test)

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'thaumcraft.gearTestProbe', 'true'
            jvmArguments.addAll '-Xms256m', '-Xmx1024m', '-XX:ActiveProcessorCount=2'
            if (providers.gradleProperty('tcGameTestRun').isPresent()) {
                def gameTestRun = providers.gradleProperty('tcGameTestRun').get()
                if (!(gameTestRun ==~ /[A-Za-z0-9_-]{1,80}/)) throw new GradleException('Invalid isolated GameTest run ID')
                gameDirectory = project.file("build/tcp-alchemy-regression/${gameTestRun}")
            }
            if (providers.gradleProperty('tcOriginalTreeComparison').isPresent()) {
                systemProperty 'thaumcraft.originalTreeComparison', providers.gradleProperty('tcOriginalTreeComparison').get()
            }
            if (providers.gradleProperty('tcOriginalMoundImport').isPresent()) {
                systemProperty 'thaumcraft.originalMoundImport', providers.gradleProperty('tcOriginalMoundImport').get()
            }
            if (providers.gradleProperty('tcOriginalLootFixtures').isPresent()) {
                systemProperty 'thaumcraft.originalLootFixtures', providers.gradleProperty('tcOriginalLootFixtures').get()
            }
            if (providers.gradleProperty('tcOriginalPlayerDataFixtures').isPresent()) {
                systemProperty 'thaumcraft.originalPlayerDataFixtures', providers.gradleProperty('tcOriginalPlayerDataFixtures').get()
            }
        }

        // One engine covers the core and JEI tests; ordinary runs keep their existing scope.
        bulkGameTestServer {
            type = 'gameTestServer'
            def bulkId = providers.gradleProperty('tcBulkRun').getOrElse('manual')
            if (!(bulkId ==~ /[A-Za-z0-9_-]{1,65}/)) throw new GradleException('Invalid bulk run ID')
            gameDirectory = project.file("build/bulk-tests/${bulkId}/server")
            systemProperty 'thaumcraft.bulkRunDir', gameDirectory.get().asFile.absolutePath
            systemProperty 'neoforge.enabledGameTestNamespaces', 'thaumcraft,thaumcraft_jei'
            systemProperty 'thaumcraft.gearTestProbe', 'true'
            jvmArguments.addAll '-Xms256m', '-Xmx1024m', '-XX:ActiveProcessorCount=2'
        }

        // Phase 12 uses fresh private worlds and only its recipe/transfer tests.
        jeiGameTestServer {
            type = 'gameTestServer'
            def reviewId = providers.gradleProperty('tcJeiReviewRun').getOrElse('manual')
            if (!(reviewId ==~ /[A-Za-z0-9_-]{1,80}/)) throw new GradleException('Invalid JEI review directory name')
            gameDirectory = project.file("build/jei-review/${reviewId}/gametest")
            systemProperty 'neoforge.enabledGameTestNamespaces', 'thaumcraft_jei'
            jvmArguments.addAll '-Xms256m', '-Xmx1024m', '-XX:ActiveProcessorCount=2'
        }

        jeiReviewClient {
            client()
            def reviewId = providers.gradleProperty('tcJeiReviewRun').getOrElse('manual')
            if (!(reviewId ==~ /[A-Za-z0-9_-]{1,80}/)) throw new GradleException('Invalid JEI review directory name')
            gameDirectory = project.file("build/jei-review/${reviewId}/client")
            jvmArguments.addAll '-Xms256m', '-Xmx1024m', '-XX:ActiveProcessorCount=2'
            systemProperty 'thaumcraft.jeiAuditReport', new File(gameDirectory.get().asFile, 'jei-audit.json').absolutePath
            systemProperty 'thaumcraft.jeiReview', 'true'
            systemProperty 'thaumcraft.jeiReviewRoot', project.file('build/jei-review').absolutePath
            systemProperty 'thaumcraft.jeiReviewWithoutJei', providers.gradleProperty('tcWithoutJei').isPresent().toString()
            if (providers.gradleProperty('tcCasterVisualReview').isPresent()) systemProperty 'thaumcraft.casterVisualReview', 'true'
            if (providers.gradleProperty('tcBulkRun').isPresent()) {
                systemProperty 'thaumcraft.sourceRecipeClientAudit', 'true'
                systemProperty 'thaumcraft.bulkGameplayReview', 'true'
            }
            programArguments.addAll '--username', 'TC_Jei_Review', '--width', '1280', '--height', '720'
        }

        // Opt-in real-terrain audit. Never reuses run/world or a player save and never accepts the EULA.
        worldgenAuditServer {
            server()
            programArgument '--nogui'
            gameDirectory = file(providers.gradleProperty('tcAuditGameDir').getOrElse('build/worldgen-audit/server'))
            systemProperty 'thaumcraft.worldgenAudit', new File(gameDirectory.get().asFile, 'generate-report.json').absolutePath
            systemProperty 'thaumcraft.worldgenAudit.phase', providers.gradleProperty('tcAuditPhase').getOrElse('generate')
            systemProperty 'thaumcraft.worldgenAudit.radius', providers.gradleProperty('tcAuditRadius').getOrElse('4')
            if (providers.gradleProperty('tcAuditCenters').isPresent()) {
                systemProperty 'thaumcraft.worldgenAudit.centers', providers.gradleProperty('tcAuditCenters').get()
            }
            systemProperty 'thaumcraft.worldgenAudit.timeoutSeconds', '900'
        }

        worldgenReviewClient {
            client()
            gameDirectory = project.file('build/worldgen-review/client')
            programArguments.addAll '--username', 'TC_Port_Review', '--width', '1440', '--height', '900'
            if (providers.gradleProperty('tcReviewWorld').isPresent()) {
                // Only an existing private copy under this isolated client directory may be opened.
                def reviewWorld = providers.gradleProperty('tcReviewWorld').get()
                if (!(reviewWorld ==~ /[A-Za-z0-9_-]+/)
                    || !new File(gameDirectory.get().asFile, "saves/${reviewWorld}/level.dat").isFile()) {
                    throw new GradleException('tcReviewWorld must name an existing isolated review save')
                }
                programArguments.addAll '--quickPlaySingleplayer', reviewWorld
            }
        }

        // Small manual client smoke check, isolated from run/saves and all network audit worlds.
        scanningReviewClient {
            client()
            def reviewId = providers.gradleProperty('tcScanningReviewRun').getOrElse('manual')
            if (!(reviewId ==~ /[A-Za-z0-9_-]{1,80}/)) {
                throw new GradleException('tcScanningReviewRun must be a simple private directory name')
            }
            gameDirectory = project.file("build/scanning-review/${reviewId}/client")
            jvmArguments.addAll '-Xms256m', '-Xmx768m'
            programArguments.addAll '--username', 'TC_Scan_Review', '--width', '960', '--height', '540'
        }

        // Opt-in real sockets/LocalPlayer audit. Launch only after preparing a new marked private root.
        playerDataAuditServer {
            server()
            programArgument '--nogui'
            jvmArguments.addAll '-Xms256m', '-Xmx1024m'
            gameDirectory = file(providers.gradleProperty('tcPlayerNetworkRoot').getOrElse('build/player-data-network/manual') + '/server')
            systemProperty 'thaumcraft.playerDataNetworkAudit', 'true'
            systemProperty 'thaumcraft.playerDataNetworkAudit.dir', gameDirectory.get().asFile.absolutePath
        }
        ['A', 'B'].each { label ->
            create("playerDataAuditClient${label}") {
                client()
                jvmArguments.addAll '-Xms256m', '-Xmx1024m'
                gameDirectory = file(providers.gradleProperty('tcPlayerNetworkRoot').getOrElse('build/player-data-network/manual') + '/client-' + label.toLowerCase())
                systemProperty 'thaumcraft.playerDataNetworkAudit', 'true'
                systemProperty 'thaumcraft.playerDataNetworkAudit.dir', gameDirectory.get().asFile.absolutePath
                def address = providers.gradleProperty('tcPlayerNetworkAddress').getOrElse('127.0.0.1:25566')
                if (!(address ==~ /127\.0\.0\.1:[0-9]{1,5}/)
                    || Integer.parseInt(address.substring(address.indexOf(':') + 1)) < 1
                    || Integer.parseInt(address.substring(address.indexOf(':') + 1)) > 65535) {
                    throw new GradleException('Player-data audit clients accept only a loopback address with a valid port')
                }
                programArguments.addAll '--username', "TC_Audit_${label}", '--width', '960', '--height', '540', '--quickPlayMultiplayer', address
            }
        }

        // Current protocol6 progression cohort, not the historical protocol4 results.
        researchProgressAuditServer {
            server()
            programArgument '--nogui'
            jvmArguments.addAll '-Xms256m', '-Xmx1024m'
            gameDirectory = new File(progressNetworkRoot, 'server')
            systemProperty 'thaumcraft.researchProgressNetworkAudit', 'true'
            systemProperty 'thaumcraft.researchCatalogNetworkAudit', 'false'
            systemProperty 'thaumcraft.playerDataNetworkAudit', 'false'
            systemProperty 'thaumcraft.researchCatalogNetworkAudit.dir', gameDirectory.get().asFile.absolutePath
        }
        ['A', 'B'].each { label ->
            create("researchProgressAuditClient${label}") {
                client()
                jvmArguments.addAll '-Xms256m', '-Xmx768m'
                gameDirectory = new File(progressNetworkRoot, 'client-' + label.toLowerCase())
                systemProperty 'thaumcraft.researchProgressNetworkAudit', 'true'
                systemProperty 'thaumcraft.researchCatalogNetworkAudit', 'false'
                systemProperty 'thaumcraft.playerDataNetworkAudit', 'false'
                systemProperty 'thaumcraft.researchCatalogNetworkAudit.dir', gameDirectory.get().asFile.absolutePath
                def address = providers.gradleProperty('tcResearchProgressNetworkAddress').getOrElse('127.0.0.1:25573')
                if (!(address ==~ /127\.0\.0\.1:[0-9]{1,5}/)
                    || Integer.parseInt(address.substring(address.indexOf(':') + 1)) < 1024
                    || Integer.parseInt(address.substring(address.indexOf(':') + 1)) > 65535) {
                    throw new GradleException('Research-progress audit clients require an exact loopback TCP address')
                }
                if (!isStageFourNetwork && progressNetworkIdentity != null && Integer.parseInt(address.substring(address.indexOf(':') + 1)) != (progressNetworkIdentity.port as int)) {
                    throw new GradleException('Client quick-play address must match the prepared private server port')
                }
                programArguments.addAll '--username', "TC_Audit_${label}", '--width', '960', '--height', '540', '--quickPlayMultiplayer', address
            }
        }

        researchStageFourAuditServer {
            server()
            programArgument '--nogui'
            jvmArguments.addAll '-Xms256m', '-Xmx1024m'
            gameDirectory = new File(progressNetworkRoot, 'server')
            systemProperty 'thaumcraft.researchStageFourNetworkAudit', 'true'
            systemProperty 'thaumcraft.researchProgressNetworkAudit', 'false'
            systemProperty 'thaumcraft.researchCatalogNetworkAudit', 'false'
            systemProperty 'thaumcraft.playerDataNetworkAudit', 'false'
            systemProperty 'thaumcraft.researchCatalogNetworkAudit.dir', gameDirectory.get().asFile.absolutePath
        }
        ['A', 'B'].each { label ->
            create("researchStageFourAuditClient${label}") {
                client()
                jvmArguments.addAll '-Xms256m', '-Xmx768m'
                gameDirectory = new File(progressNetworkRoot, 'client-' + label.toLowerCase())
                systemProperty 'thaumcraft.researchStageFourNetworkAudit', 'true'
                systemProperty 'thaumcraft.researchProgressNetworkAudit', 'false'
                systemProperty 'thaumcraft.researchCatalogNetworkAudit', 'false'
                systemProperty 'thaumcraft.playerDataNetworkAudit', 'false'
                systemProperty 'thaumcraft.researchCatalogNetworkAudit.dir', gameDirectory.get().asFile.absolutePath
                def address = providers.gradleProperty('tcResearchStageFourNetworkAddress').getOrElse('127.0.0.1:25574')
                if (!(address ==~ /127\.0\.0\.1:[0-9]{1,5}/)
                    || Integer.parseInt(address.substring(address.indexOf(':') + 1)) < 1024
                    || Integer.parseInt(address.substring(address.indexOf(':') + 1)) > 65535
                    || (isStageFourNetwork && progressNetworkIdentity != null
                        && Integer.parseInt(address.substring(address.indexOf(':') + 1)) != (progressNetworkIdentity.port as int))) {
                    throw new GradleException('Stage-four client requires the exact prepared private loopback cohort')
                }
                programArguments.addAll '--username', "TC_Audit_${label}", '--width', '960', '--height', '540', '--quickPlayMultiplayer', address
            }
        }

        tcpBootstrapAuditServer {
            server()
            programArgument '--nogui'
            gameDirectory = new File(bootstrapRoot, 'server')
            jvmArguments.addAll '-Xms256m', '-Xmx1024m', '-XX:ActiveProcessorCount=2'
            systemProperty 'thaumcraft.tcpBootstrapAudit', bootstrapReload ? 'false' : 'true'
            systemProperty 'thaumcraft.tcpBootstrapAudit.dir', gameDirectory.get().asFile.absolutePath
            systemProperty 'thaumcraft.tcpBootstrapReloadAudit', bootstrapReload ? 'true' : 'false'
            systemProperty 'thaumcraft.tcpBootstrapReloadAudit.dir', gameDirectory.get().asFile.absolutePath
        }
        tcpBootstrapAuditClient {
            client()
            gameDirectory = new File(bootstrapRoot, 'client')
            jvmArguments.addAll '-Xms256m', '-Xmx768m', '-XX:ActiveProcessorCount=2'
            systemProperty 'thaumcraft.tcpBootstrapAudit', bootstrapReload ? 'false' : 'true'
            systemProperty 'thaumcraft.tcpBootstrapAudit.dir', gameDirectory.get().asFile.absolutePath
            systemProperty 'thaumcraft.tcpBootstrapReloadAudit', bootstrapReload ? 'true' : 'false'
            systemProperty 'thaumcraft.tcpBootstrapReloadAudit.dir', gameDirectory.get().asFile.absolutePath
            def address = providers.gradleProperty('tcTcpBootstrapAddress').getOrElse('127.0.0.1:25575')
            if (!(address ==~ /127\.0\.0\.1:[0-9]{1,5}/)
                || Integer.parseInt(address.substring(address.indexOf(':') + 1)) < 1024
                || Integer.parseInt(address.substring(address.indexOf(':') + 1)) > 65535
                || (bootstrapIdentity != null && Integer.parseInt(address.substring(address.indexOf(':') + 1)) != (bootstrapIdentity.port as int))) {
                throw new GradleException('Bootstrap client requires the exact prepared loopback address')
            }
            programArguments.addAll '--username', 'TC_Bootstrap', '--width', '1280', '--height', '720', '--quickPlayMultiplayer', address
        }

        tcpAlchemyAuditServer {
            server()
            programArgument '--nogui'
            gameDirectory = new File(alchemyRoot, 'server')
            jvmArguments.addAll '-Xms256m', '-Xmx1024m', '-XX:ActiveProcessorCount=2'
            systemProperty 'thaumcraft.tcpBootstrapAudit', 'false'
            systemProperty 'thaumcraft.tcpBootstrapReloadAudit', 'false'
            systemProperty 'thaumcraft.tcpAlchemyAudit', 'true'
            systemProperty 'thaumcraft.tcpAlchemyAudit.dir', gameDirectory.get().asFile.absolutePath
        }
        tcpAlchemyAuditClient {
            client()
            gameDirectory = new File(alchemyRoot, 'client')
            jvmArguments.addAll '-Xms256m', '-Xmx768m', '-XX:ActiveProcessorCount=2'
            systemProperty 'thaumcraft.tcpBootstrapAudit', 'false'
            systemProperty 'thaumcraft.tcpBootstrapReloadAudit', 'false'
            systemProperty 'thaumcraft.tcpAlchemyAudit', 'true'
            systemProperty 'thaumcraft.tcpAlchemyAudit.dir', gameDirectory.get().asFile.absolutePath
            def address = providers.gradleProperty('tcTcpAlchemyAddress').getOrElse('127.0.0.1:25576')
            if (!(address ==~ /127\.0\.0\.1:[0-9]{1,5}/)
                || Integer.parseInt(address.substring(address.indexOf(':') + 1)) < 1024
                || Integer.parseInt(address.substring(address.indexOf(':') + 1)) > 65535
                || (alchemyIdentity != null
                    && Integer.parseInt(address.substring(address.indexOf(':') + 1)) != (alchemyIdentity.port as int))) {
                throw new GradleException('Alchemy client requires its exact prepared loopback address')
            }
            programArguments.addAll '--username', 'TC_Bootstrap', '--width', '1280', '--height', '720', '--quickPlayMultiplayer', address
        }

        tcpCasterAuditServer {
            server()
            programArgument '--nogui'
            gameDirectory = new File(casterRoot, 'server')
            jvmArguments.addAll '-Xms256m', '-Xmx1024m', '-XX:ActiveProcessorCount=2'
            systemProperty 'thaumcraft.tcpBootstrapAudit', 'false'
            systemProperty 'thaumcraft.tcpBootstrapReloadAudit', 'false'
            systemProperty 'thaumcraft.tcpAlchemyAudit', 'false'
            systemProperty 'thaumcraft.tcpCasterAudit', 'true'
            systemProperty 'thaumcraft.tcpCasterAudit.dir', gameDirectory.get().asFile.absolutePath
        }
        tcpCasterAuditClient {
            client()
            gameDirectory = new File(casterRoot, 'client')
            jvmArguments.addAll '-Xms256m', '-Xmx768m', '-XX:ActiveProcessorCount=2'
            systemProperty 'thaumcraft.tcpBootstrapAudit', 'false'
            systemProperty 'thaumcraft.tcpBootstrapReloadAudit', 'false'
            systemProperty 'thaumcraft.tcpAlchemyAudit', 'false'
            systemProperty 'thaumcraft.tcpCasterAudit', 'true'
            systemProperty 'thaumcraft.tcpCasterAudit.dir', gameDirectory.get().asFile.absolutePath
            def address = providers.gradleProperty('tcTcpCasterAddress').getOrElse('127.0.0.1:25577')
            if (!(address ==~ /127\.0\.0\.1:[0-9]{1,5}/) || Integer.parseInt(address.substring(address.indexOf(':') + 1)) < 1024
                || Integer.parseInt(address.substring(address.indexOf(':') + 1)) > 65535
                || (casterIdentity != null && Integer.parseInt(address.substring(address.indexOf(':') + 1)) != (casterIdentity.port as int))) throw new GradleException("Caster client requires its exact prepared loopback address: ${address}, prepared port ${casterIdentity?.port}")
            programArguments.addAll '--username', 'TC_Bootstrap', '--width', '1280', '--height', '720', '--quickPlayMultiplayer', address
        }

        data {
            data()
            if (providers.gradleProperty('tcMoundTemplateSource').isPresent()) {
                systemProperty 'thaumcraft.moundTemplateSource', providers.gradleProperty('tcMoundTemplateSource').get()
            }
            if (providers.gradleProperty('tcResearchSourceDirectory').isPresent()) {
                systemProperty 'thaumcraft.researchSourceDirectory', providers.gradleProperty('tcResearchSourceDirectory').get()
            }
            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Curios: API to compile against, the full mod only for dev runs
    compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}:api"
    runtimeOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}"

    implementation "com.github.glitchfiend:TerraBlender-neoforge:${terrablender_version}"

    // JEI: API for the plugin, the full mod only in dev runs
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    if (!providers.gradleProperty('tcWithoutJei').isPresent()) {
        localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    }

    // Unit tests of pure logic (without starting the game)
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Example optional mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    // We add the full version to localRuntime, not runtimeOnly, so that we do not publish a dependency on it
    // localRuntime "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.named('test', Test) {
    useJUnitPlatform()
    // Headless unit checks need neither game heaps nor concurrent test JVMs.
    maxHeapSize = '256m'
    maxParallelForks = 1
    if (providers.gradleProperty('tcBulkRun').isPresent()) outputs.upToDateWhen { false }
    if (providers.gradleProperty('tcResearchSourceDirectory').isPresent()) {
        systemProperty 'thaumcraft.researchSourceDirectory', providers.gradleProperty('tcResearchSourceDirectory').get()
    }
    if (providers.gradleProperty('tcOriginalResearchCatalogFixtures').isPresent()) {
        systemProperty 'thaumcraft.originalResearchCatalogFixtures', providers.gradleProperty('tcOriginalResearchCatalogFixtures').get()
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

tasks.matching { it.name in ['runResearchProgressAuditServer', 'runResearchProgressAuditClientA', 'runResearchProgressAuditClientB',
    'runResearchStageFourAuditServer', 'runResearchStageFourAuditClientA', 'runResearchStageFourAuditClientB'] }.configureEach {
    doFirst { tcAuditLaunchTask ->
        def stageFourTask = tcAuditLaunchTask.name.startsWith('runResearchStageFour')
        if (!progressNetworkRootProperty.isPresent() || stageFourTask != isStageFourNetwork) {
            throw new GradleException('Prepare a fresh private cohort and supply its purpose-specific TCP root before launch')
        }
        def role = tcAuditLaunchTask.name.endsWith('Server') ? 'server'
            : tcAuditLaunchTask.name.endsWith('ClientA') ? 'client-a' : 'client-b'
        def roleDirectory = new File(progressNetworkRoot, role).toPath().toAbsolutePath().normalize()
        def ownFiles = role == 'server' ? ['server-state.json', 'server-report.json'] : ['client-state.json', 'client-report.json']
        if (ownFiles.any { java.nio.file.Files.exists(roleDirectory.resolve(it), java.nio.file.LinkOption.NOFOLLOW_LINKS) }
            || java.nio.file.Files.exists(roleDirectory.resolve('logs/latest.log'), java.nio.file.LinkOption.NOFOLLOW_LINKS)
            || role == 'server' && java.nio.file.Files.exists(roleDirectory.resolve('research-catalog-network-audit'), java.nio.file.LinkOption.NOFOLLOW_LINKS)) {
            throw new GradleException('An existing role transcript/log/world is never reopened; prepare a wholly new private progression cohort')
        }
        // Revalidate path identity at execution time as well as during configuration. Other
        // roles may already be active: do NOT reject the live server's journal for a new client.
        if (roleDirectory.toRealPath() != roleDirectory) {
            throw new GradleException('Private audit role path changed before engine launch')
        }
    }
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
